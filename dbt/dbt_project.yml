name: china_africa_trade
version: "1.0.0"
config-version: 2
profile: china_africa_trade

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # CAGR window. 2025 figures are the latest release and may still be revised.
  start_year: 2015
  end_year: 2025
  # A chapter must have exported at least this much (USD) in the start year to be ranked;
  # otherwise tiny bases produce meaningless 1000%+ growth rates.
  min_base_value_usd: 1000000
  top_n: 10

models:
  china_africa_trade:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  china_africa_trade:
    +schema: reference
    hs_chapters:
      +column_types:
        hs_chapter: string
    partners:
      +column_types:
        partner_code: int64

version: 2

sources:
  - name: comtrade_raw
    database: "{{ env_var('GCP_PROJECT_ID', 'china-africa-trade') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'comtrade_raw') }}"
    description: Raw UN Comtrade records loaded by ingest/comtrade_to_bq.py (full refresh).
    tables:
      - name: comtrade_exports
        description: >
          China (reporter 156) exports to Morocco, Senegal and Côte d'Ivoire by HS 2-digit chapter,
          annual. One row per partner, year and chapter, as returned by the Comtrade preview API.
        columns:
          - name: refYear
            description: Reference year.
          - name: cmdCode
            description: HS 2-digit chapter code ("01".."99").
          - name: primaryValue
            description: Trade value in current USD (FOB for exports).
